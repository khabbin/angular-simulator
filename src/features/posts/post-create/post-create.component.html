<form [formGroup]="postForm" (ngSubmit)="onSubmit()">
  <label>
    Title
    <input type="text" formControlName="title">
  </label>
  <label>
    Body
    <textarea rows="4" formControlName="body"></textarea>
  </label>
  <label>
    User ID
    <input type="number" formControlName="userId" min="1">
  </label>
  <label>
    <input type="text" formControlName="tags" placeholder="tech, news, guide">
  </label>
  <button type="submit" [disabled]="postForm.invalid">Create post</button>
</form>
